name: Main Prerelease

# Rebuilds the desktop apps on every push to main and republishes them under a
# single rolling prerelease tag, so the README can link to stable URLs that
# always serve the tip of main. Unlike Actions artifacts these need no GitHub
# login to download and never expire.
#
# The tag is `main-latest`, not `main` — a tag sharing a name with a branch
# makes every `git <cmd> main` ambiguous, and tag.yml would treat it as a
# version tag (it explicitly ignores this one).

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: main-prerelease
  cancel-in-progress: true

jobs:
  windows-build:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos-build:
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  linux-build:
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  # The mobile half of "the tip of main, rebuilt on every merge". There is no
  # asset to attach to the prerelease below — an iOS build is not a file anyone
  # downloads from GitHub, it goes to TestFlight — so this job publishes to
  # App Store Connect itself and is deliberately absent from `publish`'s
  # `needs`. Same reasoning as manager-build: `needs` on a reusable workflow is
  # all-or-nothing, and a failed upload to Apple must not hold the desktop
  # prerelease hostage. It still shows red on the run.
  ios-testflight:
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      channel: testflight

  # The manager is only otherwise published on a tagged release, so the README
  # served a manager as old as the last tag. Building it here keeps the
  # download current with main — and a manager predating a fix cannot install
  # anything, which is exactly how the Windows asset-name bug stayed invisible.
  #
  # Build only: `publish` needs this job, and `needs` on a reusable workflow is
  # all-or-nothing — every job inside it must pass. Its integration tests
  # download from whatever release is currently newest, which is the one this
  # run is about to delete and recreate. Gating the publish on them means a
  # broken main-latest keeps main-latest broken; that deadlocked releases from
  # #243 until #271. They still run on PRs and on pushes to the manager.
  manager-build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
    with:
      run_integration_tests: 'false'

  publish:
    needs: [windows-build, macos-build, linux-build, manager-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows portable build
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-windows-portable
          path: centroidx-windows-x64/

      # The MSIX is what centroidx-manager installs on Windows — without it
      # the "latest" update channel has nothing installable here.
      - name: Download Windows MSIX
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi.msix
          path: msix/

      # Without this the MSIX above is unusable on any machine that has not
      # already trusted the sideload certificate by hand — see windows.yml for
      # why it is exported and why publishing it is safe.
      - name: Download sideload certificate
        uses: actions/download-artifact@v4
        with:
          name: centroidx-sideload.cer
          path: release/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: centroidx_darwin_arm64.dmg
          path: release/

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: centroidx_linux_x64.tar.gz
          path: release/

      # Manager binaries for all three platforms, named as the README links
      # expect them.
      - name: Download manager binaries
        uses: actions/download-artifact@v4
        with:
          pattern: centroidx-manager_*
          path: manager/
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail

          # Zipped with a top-level directory so it does not explode into the
          # user's Downloads folder. Contents are the portable Release folder:
          # centroidx.exe plus the Flutter and VC++ runtime DLLs and data/.
          zip -qr release/centroidx_windows_x64.zip centroidx-windows-x64

          # Canonical asset name the manager looks for (msix:create emits
          # centroidx.msix). Renamed before checksumming so the checksum line
          # matches the published filename.
          mv msix/*.msix release/centroidx_windows_amd64.msix

          mv manager/centroidx-manager_* release/
          ls -lh manager/ 2>/dev/null || true

          cd release
          sha256sum centroidx_windows_x64.zip centroidx_windows_amd64.msix \
                    centroidx-sideload.cer \
                    centroidx_darwin_arm64.dmg \
                    centroidx_linux_x64.tar.gz \
                    centroidx-manager_* > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      # Recreated rather than edited: gh cannot move an existing tag, and a
      # stale tag would leave the release pointing at the wrong commit.
      - name: Republish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete main-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create main-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "Automatically built from the tip of \`main\` (\`${GITHUB_SHA:0:7}\`).

          These are development builds, not a release — they have had no release testing and are replaced on every merge to \`main\`. For production use the [latest release](https://github.com/${GITHUB_REPOSITORY}/releases/latest).

          | Platform | Asset |
          |----------|-------|
          | macOS (Apple Silicon) | \`centroidx_darwin_arm64.dmg\` — Developer ID signed; notarized only when Apple's notary service accepts the build |
          | Windows (x64) | \`centroidx_windows_x64.zip\` — portable exe + libs, no installer |
          | Windows (x64) | \`centroidx_windows_amd64.msix\` — sideload installer, used by the in-app updater's latest channel |
          | Windows (x64) | \`centroidx-sideload.cer\` — public signing certificate; the MSIX will not install until this is in \`LocalMachine\\TrustedPeople\` |
          | Linux (x64) | \`centroidx_linux_x64.tar.gz\` — GTK3 desktop bundle |
          | iOS | Not downloadable here — this commit was uploaded to **TestFlight** |

          The \`centroidx-manager_*\` assets are the version manager built from this same commit; its **Latest** channel installs the packages above.

          Checksums in \`SHA256SUMS.txt\`." \
            release/centroidx_windows_x64.zip \
            release/centroidx_windows_amd64.msix \
            release/centroidx-sideload.cer \
            release/centroidx_darwin_arm64.dmg \
            release/centroidx_linux_x64.tar.gz \
            release/centroidx-manager_windows_amd64.exe \
            release/centroidx-manager_darwin_arm64.dmg \
            release/centroidx-manager_linux_amd64 \
            release/SHA256SUMS.txt
