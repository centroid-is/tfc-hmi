name: Windows MSIX Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
      release:
        description: 'Create a GitHub release with the MSIX'
        type: boolean
        default: false
  # No push trigger for main — main-prerelease.yml calls this workflow so the
  # build happens once and its artifacts get published.
  pull_request:

permissions:
  contents: write
  packages: write

# `windows-` prefix, and the expression rather than bare `true`, for the
# reasons spelled out in macos.yml: main-prerelease.yml and tag.yml each call
# this workflow alongside others in a single run, where the github context is
# the caller's.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job id stays `build` (main-prerelease.yml and tag.yml call this workflow);
  # `name` is what the status check context is called. See macos.yml.
  build:
    name: Windows MSIX Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve build sha
        shell: bash
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Embed Windows icon resource
        working-directory: tools/centroidx-manager
        shell: bash
        run: windres --use-temp-file -o centroidx.syso centroidx.rc

      - name: Build centroidx-manager for Windows
        working-directory: tools/centroidx-manager
        run: go build -o centroidx-manager_windows_amd64.exe .

      - name: Bundle manager binary into Flutter assets
        shell: bash
        run: |
          mkdir -p centroid-hmi/assets/manager
          cp tools/centroidx-manager/centroidx-manager_windows_amd64.exe \
             centroid-hmi/assets/manager/centroidx-manager_windows_amd64.exe
          ls -la centroid-hmi/assets/manager/

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Get Flutter packages
        working-directory: centroid-hmi
        run: flutter pub get

      - name: Build Windows
        working-directory: centroid-hmi
        run: flutter build windows --release --dart-define=GIT_SHA=${{ env.BUILD_SHA }}

      - name: Write certificate PFX from secret
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.MSIX_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}/centroid-hmi/centroidx-sideload.pfx", $bytes)

      # The MSIX is signed by a self-signed sideload certificate, so Windows
      # refuses to install it until that certificate is in the machine's
      # TrustedPeople store. centroidx-manager already knows how to do that —
      # downloadCertAsset() looks for a .cer or .crt among the release assets
      # and hands it to TrustCertificate — but no workflow has ever published
      # one, so the lookup always came back empty and the install hit
      # 0x800B0109 with nothing in the log to say why.
      #
      # Extracted from the PFX rather than by running scripts/generate-cert.ps1:
      # that script is documented "Do NOT run this in CI" because it calls
      # New-SelfSignedCertificate, which would mint a *different* certificate
      # from the one the package was just signed with — publishing that would
      # be worse than publishing nothing, since trusting it changes nothing and
      # looks like it should. Its output filename is reused verbatim.
      #
      # PowerShell rather than openssl: Export-Certificate is the exact inverse
      # of the Export-PfxCertificate that produced the secret, and it does not
      # care how the PFX was encrypted. OpenSSL 3 needs -legacy for PFXs
      # written by older Windows tooling, which is a portability trap for a
      # step that must not break silently.
      - name: Export the public sideload certificate
        working-directory: centroid-hmi
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $password = ConvertTo-SecureString "${{ secrets.MSIX_CERT_PASSWORD }}" -AsPlainText -Force
          $signing = (Get-PfxData -FilePath "centroidx-sideload.pfx" -Password $password).EndEntityCertificates[0]
          Export-Certificate -Cert $signing -FilePath "centroidx-sideload.cer" -Type CERT | Out-Null

          # Read back what was actually written, not what we think we wrote.
          # This asset is published to the world, so the two things that must
          # be true about it are checked against the file itself.
          $exported = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 `
            ((Resolve-Path "centroidx-sideload.cer").Path)

          # A DER certificate cannot physically carry a private key, but this
          # is the assertion anyone reviewing "we publish our signing cert"
          # will look for.
          if ($exported.HasPrivateKey) {
            throw "Exported certificate carries a private key — refusing to publish it"
          }

          # Trusting the wrong certificate is indistinguishable from trusting
          # none. pubspec.yaml anchors the package identity to this subject.
          $expected = "CN=2F2634E3-C7B6-45A4-A112-0D039FC2ECDB"
          if ($exported.Subject -ne $expected) {
            throw "Exported certificate subject is '$($exported.Subject)', expected '$expected'"
          }

          Write-Host "Exported $expected"
          Write-Host "  thumbprint: $($exported.Thumbprint)"
          Write-Host "  valid until: $($exported.NotAfter.ToString('yyyy-MM-dd'))"

      - name: Upload sideload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: centroidx-sideload.cer
          path: centroid-hmi/centroidx-sideload.cer

      - name: Build MSIX (sideload, signed)
        working-directory: centroid-hmi
        shell: powershell
        # msix:create reruns "flutter build windows" itself, so the GIT_SHA
        # define has to ride along or the packaged exe loses its build stamp.
        run: echo "n" | dart run msix:create --certificate-password "${{ secrets.MSIX_CERT_PASSWORD }}" --windows-build-args "--dart-define=GIT_SHA=${{ env.BUILD_SHA }}"

      - name: Verify MSIX is signed
        working-directory: centroid-hmi
        shell: powershell
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No .msix file found after build" }
          Write-Host "MSIX built: $($msix.FullName) ($([math]::Round($msix.Length/1MB, 1)) MB)"

      - name: Locate MSIX
        working-directory: centroid-hmi
        id: locate
        shell: powershell
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No .msix file found" }
          "msix=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi.msix
          path: ${{ steps.locate.outputs.msix }}

      # Portable (no-install) build: the Release folder runs directly after
      # unzip. The MSIX declares the VC++ runtime as a package dependency, but
      # a bare exe needs the DLLs next to it — copy them in. Done after the
      # MSIX is packaged so its contents stay unchanged.
      - name: Make Release folder portable (bundle VC++ runtime)
        shell: powershell
        run: |
          $release = "centroid-hmi/build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$dll" $release
          }
          # msix:create drops the package here, so it would otherwise ride
          # along inside the portable zip — 26 MB of installer in a download
          # whose whole point is not being an installer. Already uploaded as
          # its own artifact by this point.
          Remove-Item "$release/*.msix" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $release

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi-windows-portable
          path: centroid-hmi/build/windows/x64/runner/Release/
