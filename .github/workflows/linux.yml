name: Linux Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
  # Unfiltered: every PR must prove it does not break the desktop build that
  # main-prerelease.yml publishes.
  pull_request:

permissions:
  contents: read

# One run per ref. Every push to a PR used to stack another full desktop build
# on top of the superseded one; with five such workflows firing per push the
# queue reached 52 runs against 5 executors.
#
# Hardcoded slug, NOT `${{ github.workflow }}`: inside a reusable workflow the
# `github` context describes the *caller*, so main-prerelease.yml calling
# windows/macos/linux would give all three the same group and they would
# cancel or queue behind each other. Cancellation is limited to pull requests
# for the same reason — for a called run `github.event_name` is the caller's
# event (`push`), so a release build is never killed by someone's PR push.
concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve build sha
        shell: bash
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # GTK for the desktop shell, libsecret/jsoncpp for
      # flutter_secure_storage_linux, liblzma for the Flutter toolchain.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Get Flutter packages
        working-directory: centroid-hmi
        run: flutter pub get

      - name: Build Linux
        working-directory: centroid-hmi
        run: flutter build linux --release --dart-define=GIT_SHA=${{ env.BUILD_SHA }}

      # The bundle is already relocatable — the runner has an $ORIGIN/lib
      # rpath — so a plain tarball of the directory runs anywhere with GTK3.
      - name: Package portable bundle
        working-directory: centroid-hmi/build/linux/x64/release
        run: |
          mv bundle centroidx-linux-x64
          tar -czf "$GITHUB_WORKSPACE/centroidx_linux_x64.tar.gz" centroidx-linux-x64
          ls -lh "$GITHUB_WORKSPACE/centroidx_linux_x64.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: centroidx_linux_x64.tar.gz
          path: centroidx_linux_x64.tar.gz
