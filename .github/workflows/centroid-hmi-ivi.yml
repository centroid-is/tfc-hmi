name: Build and Push centroid-hmi Docker Image (ivi-homescreen)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build in release mode'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
      release:
        description: 'Build in release mode'
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

# See the note in centroid-hmi.yml: hardcoded slug rather than
# `${{ github.workflow }}` so a caller cannot collapse several called
# workflows into one group, and cancellation limited to pull requests so a
# release build is never killed by a PR push.
concurrency:
  group: centroid-hmi-ivi-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      centroid_hmi_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/frontend-ivi/Dockerfile.build
          build-args: |
            BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:latest

      - name: Build and push Docker image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/frontend-ivi/Dockerfile.build
          build-args: |
            BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:stable

      - name: Build and push Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/frontend-ivi/Dockerfile.build
          build-args: |
            BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:pr-${{ github.event.pull_request.number }}

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-backend:latest

      - name: Build and push backend Docker image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-backend:stable

      - name: Build and push backend Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:pr-${{ github.event.pull_request.number }}
