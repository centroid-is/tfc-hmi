  open62541:
    git:
      url: https://github.com/centroid-is/open62541_dart.git
      ref: 6a34f3482f6c9c2e51c4dc78e5625e4a3b38021e

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
