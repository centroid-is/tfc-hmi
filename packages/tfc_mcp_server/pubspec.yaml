name: tfc_mcp_server
description: MCP server for TFC HMI AI copilot
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.1

dependencies:
  archive: ^4.0.0
  xml: ^6.5.0
  # Pinned: newer mcp_dart (2.4.0 observed, 2026-08) removes server-initiated
  # elicitation ("elicitation/create is a legacy server-initiated
  # interaction"), which ElicitationRiskGate depends on. Migrate to stateless
  # elicitation before unpinning.
  mcp_dart: 2.0.0
  drift: ^2.28.0
  drift_postgres: ^1.3.1
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581
  logger: ^2.4.0
  json_annotation: ^4.9.0
  args: ^2.4.2
  tfc_dart:
    path: ../tfc_dart
  rxdart: ^0.28.0
  uuid: ^4.5.1
  petitparser: ^7.0.0

dependency_overrides:
  open62541:
    git:
      url: https://github.com/centroid-is/open62541_dart.git
      # isolate-self-heal head; tfc_dart's StateMan uses its new keepConnected
      # parameters, and this package compiles tfc_dart under ITS OWN
      # resolution, so the override must exist here too. Swap for hosted
      # 1.5.7+2 once released. Keep in step with the root pubspec.yaml.
      ref: 2474f7375fac05972de644259f70b804c4578baf
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581
  archive: 4.0.2

dev_dependencies:
  lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  drift_dev: ^2.28.0
  test: ^1.25.0
