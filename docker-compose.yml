services:
  seatd:
    image: ghcr.io/centroid-is/weston:latest
    container_name: seatd
    privileged: true
    user: root
    restart: unless-stopped
    volumes:
      - /dev:/dev:rw
      - /run/udev:/run/udev:ro
      - ./seatd-socket:/run # I know, this is not good
    command: seatd -g seat

  weston:
    image: ghcr.io/centroid-is/weston:latest
    container_name: weston
    user: root
    privileged: true
    volumes:
      - ./wayland-socket/user:/run/user
      - ./seatd-socket:/run
      - /dev:/dev:rw
      - /run/udev:/run/udev:ro
    environment:
      XDG_RUNTIME_DIR: /run/user/1000
    ports:
      - 5900:5900
    restart: unless-stopped
    entrypoint: >
      bash -lc "
        echo 'centroid:foo' | chpasswd &&
        mkdir -p /run/user/1000 &&
        chown 1000:1000 /run/user/1000 &&
        chmod 0700 /run/user/1000 &&
        exec su -s /bin/bash -c '
         export XDG_RUNTIME_DIR=/run/user/1000
         exec weston -c /home/centroid/.config/weston.ini
        ' centroid
      "

  # Browser access to the mirrored HMI. websockify bridges wss:// to weston's
  # screen-share VNC on 5900, which stays published above for native clients.
  #
  # Only reachable if weston runs *without* --vnc-tls-cert: noVNC cannot speak
  # VeNCrypt/X509, so it needs RA2ne (see centroid-is/dockers, weston/neatvnc).
  #
  # HTTPS is not optional. Browsers expose window.crypto.subtle only in a
  # secure context, and noVNC's RA2ne path needs it — over plain http it dies
  # with "Cannot read properties of undefined (reading 'digest')".
    labels:
      - hmi-update.watch=true

  novnc:
    image: ghcr.io/centroid-is/novnc:latest
    container_name: novnc
    ports:
      - 443:6080
    environment:
      # Names the station in the browser tab: "CentroidX - Frystar".
      # Set it per HMI in a .env beside this file — one image serves them
      # all, so this is the only thing that distinguishes them. Leave it
      # unset and the tab just reads "CentroidX".
      NOVNC_STATION_NAME: ${NOVNC_STATION_NAME:-}
    volumes:
      - ./novnc_certs:/certs
    depends_on:
      - weston
    restart: unless-stopped
    labels:
      - hmi-update.watch=true

  # Operators type a bare address, which means http. Send them to https —
  # it cannot be a fallback, since noVNC's RA2ne handshake needs
  # window.crypto.subtle and browsers withhold that on an insecure origin.
  novnc-http:
    image: ghcr.io/centroid-is/novnc:latest
    container_name: novnc-http
    entrypoint: ["python3", "/usr/local/bin/redirect.py"]
    ports:
      - 80:80
    restart: unless-stopped
    labels:
      - hmi-update.watch=true


  create-local-share:
    image: alpine:latest
    container_name: create-local-share
    volumes:
      - ./local-share:/home/centroid/.local/share
    command: |
      sh -euxc '
        chown 1000:1000 /home/centroid/.local/share
      '

  # `latest-release` is the *profile* build: AOT-compiled exactly like release,
  # so what you measure here is what the operator feels, but with the Dart VM
  # Service, the sampling CPU profiler and the `Flutter.Frame` timing events
  # still compiled in. `latest` is a debug/JIT build — fine for a desk, several
  # times slower on a station, and its numbers mean nothing.
  flutter:
    image: ghcr.io/centroid-is/centroid-hmi:latest-release
    container_name: flutter
    group_add:
      - 992
    volumes:
      - ./wayland-socket/user:/run/user
      - ./local-share:/home/centroid/.local/share/ # shared preferences
      - ./opcua_certs:/certs:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
    environment:
      # TFC_GOD: true
      XDG_RUNTIME_DIR: /run/user/1000
      WAYLAND_DISPLAY: wayland-1
      SECRET_BACKEND: file
      SECRET_FILE_TEST_PATH: /home/centroid/.local/share/keyrings/flutter.keyring
      SECRET_FILE_TEST_PASSWORD: TODOSetThisStrongPassword # openssl rand -base64 32
      # Engine switches. The flutter-elinux embedder reads these from the
      # environment rather than argv (GetSwitchesFromEnvironment), and ignores
      # them entirely in a release build. Miscount FLUTTER_ENGINE_SWITCHES and
      # the embedder complains on stderr about the missing key.
      #
      #   1  the sampling profiler is off unless asked for — without it
      #      getCpuSamples answers "Feature is disabled"
      #   2  a fixed port; the default is random and printed once, to the log
      #   3  the default 127.0.0.1 is unreachable from the profiler container
      #   4  no per-boot secret in the websocket path, so tools need no
      #      log-scraping to find the URI
      #
      # 8181 is deliberately NOT in a `ports:` block. Whoever reaches it can
      # read this app's memory and evaluate code in its isolate, so it stays on
      # the compose network. See docker/profiler/README.md.
      FLUTTER_ENGINE_SWITCHES: 4
      FLUTTER_ENGINE_SWITCH_1: enable-dart-profiling
      FLUTTER_ENGINE_SWITCH_2: vm-service-port=8181
      FLUTTER_ENGINE_SWITCH_3: vm-service-host=0.0.0.0
      FLUTTER_ENGINE_SWITCH_4: disable-service-auth-codes
    expose:
      - "8181" # Dart VM Service — compose network only, see above
    devices:
      - /dev/dri/renderD128
    depends_on:
      - weston
      - timescaledb
      - create-local-share
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # Reads the VM Service above and writes performance reports. Opt-in: it sits
  # behind a compose profile, so `docker compose up -d` never starts it.
  #
  #   docker compose --profile profiling up -d profiler   # continuous
  #   docker compose run --rm profiler report --seconds 30  # once, to stdout
  #
  # No container_name — `docker compose run` needs to be able to make its own.
  profiler:
    image: ghcr.io/centroid-is/hmi-profiler:latest
    profiles: ["profiling"]
    depends_on:
      - flutter
    environment:
      HMI_VM_SERVICE_URI: ws://flutter:8181/ws
    # A 20 s window every 15 minutes. Collecting is not free — the CPU profiler
    # samples at 250 µs and the timeline records — so this is a duty cycle a
    # station can carry, not a setting to turn up and forget.
    command:
      - watch
      - --seconds=20
      - --interval=900
      - --wait=120 # the app takes a while to come up after a station reboot
      - --out-dir=/reports
    volumes:
      - profiler-reports:/reports
    restart: unless-stopped
    labels:
      - hmi-update.watch=true

  # hmi-update — single Go binary with embedded Svelte UI, per-container
  # Update/Rollback/Force-pull buttons, on :8080. Replaces watchtower, which
  # pulled :latest blindly with no rollback and no record of what changed.
  #
  # Only services labelled hmi-update.watch=true are considered.
  docker-update:
    image: ghcr.io/centroid-is/docker-update:latest
    container_name: docker-update
    restart: unless-stopped
    # 65532 = distroless nonroot UID. The GID must match the host's docker
    # group, which is NOT the same on every station. Override per station in
    # a .env beside this file:
    #
    #   echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> .env
    #
    # docker-update-state checks this at boot and fails loudly with that
    # exact command if it is wrong, rather than leaving a container that
    # cannot reach the daemon.
    user: "65532:${DOCKER_GID:-1001}"
    ports:
      # 8443 serves the UI over TLS; 8080 answers 301s to it so the old
      # bookmark still works.
      - "8443:8443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read the live compose so Update/Rollback can drive
      # `docker compose -f <path> up -d --force-recreate <svc>`. Read-only —
      # hmi-update never writes the compose file itself.
      - /home/centroid/docker-compose.yml:/etc/docker-update/docker-compose.yml:ro
      - /home/centroid/docker-update:/state
      - ./docker_update_certs:/certs:ro
    environment:
      DOCKER_UPDATE_CRON: "0 * * * *"
      DOCKER_UPDATE_COMPOSE_PATH: /etc/docker-update/docker-compose.yml
      DOCKER_UPDATE_STATE_PATH: /state/docker_update_state.json
      DOCKER_UPDATE_LOG_LEVEL: info
      DOCKER_UPDATE_SELF_SERVICE: docker-update
      COMPOSE_PROJECT_NAME: centroid
      DOCKER_UPDATE_TLS_CERT: /certs/docker-update.crt
      DOCKER_UPDATE_TLS_KEY: /certs/docker-update.key
      DOCKER_UPDATE_TLS_ADDR: ":8443"
      # PLACEHOLDERS. Override per station via a .env file next to this
      # compose — do not commit real credentials here. Basic auth guards
      # every route except /healthz, which stays open for probes.
      DOCKER_UPDATE_BASIC_AUTH_USER: ${DOCKER_UPDATE_BASIC_AUTH_USER:-centroid}
      DOCKER_UPDATE_BASIC_AUTH_PASS: ${DOCKER_UPDATE_BASIC_AUTH_PASS:-change-me}
    depends_on:
      docker-update-certs:
        condition: service_completed_successfully
      docker-update-state:
        condition: service_completed_successfully
    labels:
      hmi-update.watch: "false"


  # Same one-shot pattern as pg-certs. docker-update runs as uid 65532 and
  # cannot mint its own certificate, so one is generated here and chowned
  # to it.
  docker-update-certs:
    image: alpine:latest
    container_name: docker-update-certs
    restart: "no"
    volumes:
      - ./docker_update_certs:/out
    command: |
      sh -euxc '
        apk add --no-cache openssl
        [ -f /out/docker-update.crt ] && [ -f /out/docker-update.key ] && { echo "TLS certs exist, skipping"; exit 0; }
        openssl req -x509 -newkey rsa:2048 -nodes -days 365000 \
          -subj "/C=IS/ST=Hofudborgarsvaedid/L=Hafnarfjordur/O=Centroid/CN=${DOCKER_UPDATE_CERT_CN:-centroidx-hmi}" \
          -addext "subjectAltName=DNS:${DOCKER_UPDATE_CERT_CN:-centroidx-hmi},DNS:localhost,IP:127.0.0.1" \
          -keyout /out/docker-update.key \
          -out /out/docker-update.crt
        chown 65532:65532 /out/docker-update.key /out/docker-update.crt
        chmod 600 /out/docker-update.key
        chmod 644 /out/docker-update.crt
        echo "Certs written to /out as uid 65532"
      '


  # Same shape as create-local-share: a root one-shot that prepares a bind
  # mount the real service cannot prepare for itself. docker-update runs as
  # uid 65532 and Docker creates missing bind sources as root:root, so
  # without this the updater cannot write its state file.
  #
  # It also verifies the docker GID, because that is the other half of the
  # per-station setup and the failure is otherwise silent — a container that
  # starts, then cannot reach the daemon.
  docker-update-state:
    image: alpine:latest
    container_name: docker-update-state
    restart: "no"
    volumes:
      - /home/centroid/docker-update:/state
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: |
      sh -euc '
        chown 65532:65532 /state
        chmod 700 /state
        echo "state dir ready, owned by 65532"

        want=$$(stat -c %g /var/run/docker.sock)
        have="${DOCKER_GID:-1001}"
        if [ "$$want" != "$$have" ]; then
          echo "docker-update is configured with GID $$have but this host'"'"'s" >&2
          echo "docker socket is group $$want. It will not reach the daemon." >&2
          echo "Fix with:  echo DOCKER_GID=$$want >> .env && docker compose up -d" >&2
          exit 1
        fi
        echo "docker GID $$have matches the socket"
      '


  centroidx-backend:
    image: ghcr.io/centroid-is/centroid-backend:latest
    container_name: centroidx-backend
    restart: unless-stopped
    environment:
      CENTROID_PGHOST: timescaledb
      CENTROID_PGPORT: 5432
      CENTROID_PGDATABASE: hmi
      CENTROID_PGUSER: centroid
      CENTROID_PGPASSWORD: FooBarHelloWorld
      CENTROID_PGSSLMODE: require
      CENTROID_STATEMAN_FILE_PATH: /config/stateman.json
    volumes:
      - ./tfc_config:/config:rw # server can update config itself
    ports:
      - 4840:4840
    labels:
      - hmi-update.watch=true

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=hmi
      - POSTGRES_USER=centroid
      - POSTGRES_PASSWORD=FooBarHelloWorld
      # (Optional) You can also set PGDATA or other environment variables.
    ports:
      - 5432:5432
    volumes:
      - ./timescale_data:/var/lib/postgresql/data
      - ./timescale_certs:/certs:ro
    depends_on:
      pg-certs:
        condition: service_completed_successfully
    command: >
      postgres -c ssl=on
               -c ssl_cert_file=/certs/server.crt
               -c ssl_key_file=/certs/server.key
               -c ssl_min_protocol_version=TLSv1.2

  pg-certs:
    image: alpine:latest
    container_name: pg-certs
    restart: "no"
    volumes:
      - ./timescale_certs:/out
    command: |
      sh -euxc '
        apk add --no-cache openssl
        [ -f /out/server.key ] && [ -f /out/server.crt ] && { echo "TLS certs exist, skipping"; exit 0; }
        openssl req -x509 -newkey rsa:2048 -nodes -days 365000 \
          -subj "/C=IS/ST=Hofudborgarsvaedid/L=Hafnarfjordur/O=Centroid/CN=timescaledb" \
          -keyout /out/server.key \
          -out /out/server.crt
        chown 70:70 /out/server.key /out/server.crt
        chmod 600 /out/server.key
        chmod 644 /out/server.crt
        echo "Certs written to /out as uid:gid 70:70"
      '

volumes:
  # `docker compose cp profiler:/reports ./profiler-reports` to collect them.
  profiler-reports:
