# The relay gateway, as a fragment that runs BESIDE an existing stack.
#
# This file deliberately does not define timescaledb, and deliberately does not
# touch docker/backend/docker-compose.yml. On a rig the backend stack is
# already up with its own volumes and its own certificate job; bringing a
# second copy of those definitions along would either fight it or replace it.
#
# So the database network is `external: true`. The gateway joins the network
# the running timescaledb is already on, and the two containers reach each
# other by service name — `timescaledb` resolves inside the gateway exactly as
# it does inside centroidx-backend.
#
#   1. Find the network:      docker inspect -f \
#                               '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' \
#                               timescaledb
#   2. Put it in .env:        echo 'GATEWAY_DATA_NET=<that name>' > .env
#   3. Bring it up:           docker compose -f docker/relay-gateway/docker-compose.yml up -d
#
# Step 1 is not optional guesswork: compose prefixes a network with its project
# name, so what a compose file calls `data-net` is really `<project>_data-net`,
# and the project name is whatever the directory happened to be called. On the
# SVN rig the answer turned out to be neither — it is `centroid_default`, the
# default network of a project called `centroid`, which is the default below.
# Run the inspect anyway; the next rig will differ again.
#
# To MERGE this into an existing compose file by hand instead: copy the
# `centroidx-relay-gateway:` service block into the existing `services:` map,
# change `networks: [data-net-external]` to the existing file's own network
# name, and drop the `networks:` block at the bottom of this file entirely.

services:
  centroidx-relay-gateway:
    build:
      # The repository root. The Dockerfile copies only packages/, and
      # Dockerfile.dockerignore prunes the rest of the context.
      context: ../..
      dockerfile: docker/relay-gateway/Dockerfile
    image: centroidx-relay-gateway:local
    container_name: centroidx-relay-gateway
    restart: unless-stopped

    # Everything the process reads is in here: gateway.json, the keymappings
    # file, pki/, tokens.json. Read-only, because the gateway writes none of
    # them — relay_certs does, and it runs as a separate one-shot (see README).
    #
    # ${GATEWAY_CONFIG_DIR} so the rig can point at /home/centroid/tfc_config's
    # sibling without editing this file.
    volumes:
      - ${GATEWAY_CONFIG_DIR:-./config}:/config:ro

    # The wss port.
    #
    # 9443 and not the 8443 you might expect: on the SVN rig **8443 is already
    # published by `docker-update`**, so a reader following this file verbatim
    # got a port clash. 9443 was free there and is now the default on both
    # sides.
    #
    # GATEWAY_PORT is the port INSIDE the container and must equal
    # `server.port` in gateway.json — compose cannot read that file, so the two
    # are kept in step by hand. It is a variable rather than a literal so the
    # healthcheck below cannot drift from the mapping.
    ports:
      - "${GATEWAY_WSS_PORT:-9443}:${GATEWAY_PORT:-9443}"

    # No `depends_on`: timescaledb is not in this file, and the gateway is
    # correct without a database — collection is a block an operator turns on.
    # A database that is down costs history and nothing else (the collection
    # runner's start is deliberately not awaited before the socket exists).
    networks:
      - data-net-external

    # The gateway's shutdown is ordered — collection flush, then the server so
    # panels see a closed socket rather than confident stale numbers, then the
    # links. Docker's default 10 s SIGTERM grace can cut that short on a
    # gateway with a full write buffer.
    stop_grace_period: 30s

    # `serving on ...` is an INFO line, not a readiness endpoint, and the
    # gateway has no HTTP health route — the one route upgrades WebSockets. So
    # the check is the thing a panel actually does: open the port.
    #
    # `bash` and not CMD-SHELL: /bin/sh in debian-slim is dash, which has no
    # /dev/tcp, and the check would fail on every image that is working fine.
    # The runtime image has no curl and no netcat, and adding one for a
    # liveness probe is a package more than the job needs.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${GATEWAY_PORT:-9443}"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Generous, because `plant.start()` is awaited before the socket is
      # bound: every configured link gets a connection attempt first, and an
      # unreachable PLC costs its full timeout before the port answers.
      # Measured at ~14 s for two OPC UA links pointed at black-hole
      # addresses; a rig with more links and a PLC that is off will be
      # slower.
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  data-net-external:
    external: true
    name: ${GATEWAY_DATA_NET:-centroid_default}
